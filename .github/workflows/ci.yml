name: CI

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]

jobs:
  secret-scan:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Reject committed secrets
        run: |
          if git grep -I -n -E 'ASR_API_KEY=sk-|sk-[a-zA-Z0-9]{20,}' -- ':!.github/workflows/ci.yml'; then
            echo 'Possible API key found in the repo. Remove it before merging.'
            exit 1
          fi
          echo 'Secret scan passed.'

  lint-extension:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Validate manifest.json
        run: |
          node -e "
            const fs = require('fs');
            const m = JSON.parse(fs.readFileSync('extension/manifest.json', 'utf8'));
            if (m.manifest_version !== 3) throw new Error('Expected manifest_version 3');
            console.log('manifest.json OK:', m.name, m.version);
          "

  lint-backend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: backend/package-lock.json

      - name: Install dependencies
        run: npm ci
        continue-on-error: true

      - name: Check backend structure
        run: test -f package.json && test -f src/index.js
